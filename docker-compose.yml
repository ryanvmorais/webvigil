# WebVigil — API + dashboard.
#   docker compose up --build
# Then open the dashboard at http://localhost:3000 and complete first-run setup.
# The API's Swagger UI stays at http://localhost:8000/docs.
services:
  api:
    build:
      context: .
      args:
        EXTRAS: "--extra web"
    entrypoint: ["webvigil-web"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WEBVIGIL_DATABASE_PATH: /data/webvigil.db
      # Pin this in production so sessions survive a rebuild:
      # WEBVIGIL_SESSION_SECRET: "<32+ characters, e.g. the output of: openssl rand -base64 48>"
      # WEBVIGIL_COOKIE_SECURE: "true"          # when served over HTTPS
    ports:
      # Loopback only: until the first account exists POST /api/setup is open to whoever reaches
      # the port, and a signed-in user can scan any URL this host can reach. See docs/web-api.md.
      - "127.0.0.1:8000:8000"
    volumes:
      - webvigil-data:/data

  web:
    build:
      context: ./web
      args:
        # Next bakes the /api/* proxy target at build time (RNF-06); this is the API
        # service on the compose network.
        API_PROXY_TARGET: "http://api:8000"
    environment:
      API_PROXY_TARGET: "http://api:8000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # A deliberately-vulnerable target for manual Active-Mode scans (spec 006). Not started
  # by `docker compose up`; bring it up explicitly:
  #   docker compose --profile targets up target
  #   webvigil scan http://localhost:8080 --mode active --authorized-by me
  target:
    profiles: ["targets"]
    build:
      context: .
      dockerfile: docker/target.Dockerfile
    ports:
      # An intentionally vulnerable app: never publish it beyond this machine.
      - "127.0.0.1:8080:8080"

volumes:
  webvigil-data:
