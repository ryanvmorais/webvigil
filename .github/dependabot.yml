# Dependabot version updates — consumed by GitHub, no CI of its own.
# Opens routine dependency PRs on a schedule. This is separate from Dependabot
# security updates (driven by Dependabot alerts, enabled at the repo level and
# needing no config file); those keep running regardless of this file.
# Schedule: Sunday, 09:00 (America/Sao_Paulo). Each ecosystem opens a single PR
# grouping its minor and patch bumps; a major stays in its own PR. Security
# updates follow the alerts and ignore this schedule.
# Cooldown: a new release waits 7 days before Dependabot proposes it (selectolax 1.0.0, which broke the
# engine, became a pull request the day it was published); security updates ignore the cooldown.
version: 2
updates:
  # Engine + CLI + Web API — direct deps from pyproject.toml, graph pinned in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Web UI — pnpm workspace under web/, lockfile is web/pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions pinned in .github/workflows/ci.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Container base images: the CLI image (Dockerfile), the scan-target fixture (docker/) and the
  # dashboard image (web/). A new base image is how the CLI image picks up OS security fixes; the
  # release workflow rebuilds it from the Dockerfile at every release.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
      - "/web"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
