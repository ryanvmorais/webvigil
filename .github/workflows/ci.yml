name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Show Python version
        run: uv run python -c "import sys; print(sys.version)"

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy src

      - name: Import contracts
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the CLI image
        run: docker build -t webvigil:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm webvigil:ci version
          docker run --rm webvigil:ci list-checks
          # report re-renders a saved scan offline, exercising the packaged HTML template
          echo '{"metadata":{"target":"https://example.com/","mode":"passive","scope":"host","tool_version":"0","started_at":"2026-01-01T00:00:00Z","finished_at":"2026-01-01T00:00:01Z","pages_scanned":1,"counts":{"INFO":0,"LOW":0,"MEDIUM":0,"HIGH":0,"CRITICAL":0}},"findings":[],"errors":[],"warnings":[]}' > scan.json
          docker run --rm -v "$PWD:/work" webvigil:ci report /work/scan.json --format html > /dev/null
