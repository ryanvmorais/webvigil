# CI pipeline (GitHub Actions). Four independent jobs, each mirroring a slice of
# the local quality gate so that a green check means the same as a clean checkout:
#   quality  engine/CLI on 3.12 and 3.13 — ruff, black, mypy, import-linter, pytest
#   web      dashboard — generated types current, lint, format, typecheck, test, build, e2e
#   docker   both images build; the CLI image smoke-tests a report render offline
#   compose  `docker compose up --build`: the API and the dashboard start and talk to each other
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Show Python version
        run: uv run python -c "import sys; print(sys.version)"

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy src

      - name: Import contracts
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps (OpenAPI dump, fixture app, webvigil-web)
        run: uv sync --all-extras

      - uses: pnpm/action-setup@v6
        with:
          # Take the pnpm version from web/package.json's `packageManager` field
          # (there is no root package.json), so it stays a single source of truth.
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: OpenAPI types are current
        run: |
          uv run python scripts/dump-openapi.py
          pnpm --dir web gen:api
          git diff --exit-code -- web/openapi.json web/src/lib/api-types.ts \
            || (echo "::error::run 'uv run python scripts/dump-openapi.py && pnpm -C web gen:api'" && exit 1)

      - name: Lint
        run: pnpm --dir web lint

      - name: Format
        run: pnpm --dir web format:check

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Unit tests
        run: pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

      - name: End-to-end
        run: |
          # The runner preconfigures the Google Chrome apt repo, which
          # periodically serves a bad index (Hash Sum mismatch) and breaks the
          # `apt-get update` that `--with-deps` runs. Playwright ships its own
          # Chromium, so drop that source first. Then retry — the Ubuntu mirrors
          # themselves also flake.
          sudo rm -f /etc/apt/sources.list.d/*google*.list /etc/apt/sources.list.d/*google*.sources
          ok=
          for i in 1 2 3; do
            if pnpm --dir web exec playwright install --with-deps chromium; then ok=1; break; fi
            sleep 15
          done
          [ -n "$ok" ] || { echo "playwright install failed after 3 tries"; exit 1; }
          pnpm --dir web test:e2e

      - name: Web image builds
        run: docker build --build-arg API_PROXY_TARGET=http://api:8000 -t webvigil-web:ci ./web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the CLI image
        run: docker build -t webvigil:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm webvigil:ci version
          docker run --rm webvigil:ci list-checks
          # report re-renders a saved scan offline, exercising the packaged HTML template
          echo '{"metadata":{"target":"https://example.com/","mode":"passive","scope":"host","tool_version":"0","started_at":"2026-01-01T00:00:00Z","finished_at":"2026-01-01T00:00:01Z","pages_scanned":1,"counts":{"INFO":0,"LOW":0,"MEDIUM":0,"HIGH":0,"CRITICAL":0}},"findings":[],"errors":[],"warnings":[]}' > scan.json
          docker run --rm -v "$PWD:/work" webvigil:ci report /work/scan.json --format html > /dev/null

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The stack a user gets from `docker compose up --build` (spec 003, RNF-09). The
      # `target` service stays off: it sits behind the `targets` profile.
      - name: Start the stack
        run: docker compose up --build --detach

      - name: Wait for the API and the dashboard
        run: |
          for url in http://127.0.0.1:8000/api/health http://127.0.0.1:3000/login; do
            for i in $(seq 1 60); do
              curl -fs "$url" > /dev/null && continue 2
              sleep 2
            done
            echo "$url did not answer in 120 s"
            exit 1
          done

      # Everything below goes through port 3000 only. The dashboard proxies /api/* to the
      # API service (the target baked into the image at build time, RNF-06), so each call
      # proves the two containers talk to each other, cookie included.
      - name: First-run setup and login through the dashboard
        run: |
          base=http://127.0.0.1:3000
          json='content-type: application/json'
          creds='{"username":"smoke","password":"smoke-test-password"}'
          curl -fs "$base/api/health" | grep -q '"status":"ok"'
          curl -fs "$base/api/setup" | grep -q '"needs_setup":true'
          curl -fs -X POST "$base/api/setup" -H "$json" -d "$creds" > /dev/null
          curl -fs -c jar.txt -X POST "$base/api/auth/login" -H "$json" -d "$creds" > /dev/null
          curl -fs -b jar.txt "$base/api/auth/me" | grep -q '"username":"smoke"'
          curl -fs -b jar.txt "$base/api/setup" | grep -q '"authenticated":true'

      - name: Show the logs when it failed
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
