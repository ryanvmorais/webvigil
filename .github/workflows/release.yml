# Release pipeline (GitHub Actions). Publishing is the maintainer's act (docs/releasing.md): this
# workflow only runs when a GitHub Release is published, or when it is started by hand for a dry run.
#   build     one `uv build`, checked the same way CI checks it; the artifact is what gets published
#   testpypi  dry run on test.pypi.org, started by hand (workflow_dispatch); never touches pypi.org
#   pypi      the real release on pypi.org, only from a published GitHub Release (tag vX.Y.Z)
#   image     the CLI container image on ghcr.io: built, smoke-tested and scanned first, then pushed for
#             linux/amd64 and linux/arm64 with signed build provenance. A manual run builds, tests and
#             scans everything and pushes nothing.
# PyPI Trusted Publishing (OIDC): no token is stored anywhere. The "pending publisher" and the two
# environments below exist on PyPI, TestPyPI and GitHub (see docs/releasing.md). The image uses the
# workflow's own GITHUB_TOKEN to write to ghcr.io/ryanvmorais/webvigil.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time, never cancelled: a publish stopped halfway could leave PyPI and
# ghcr.io out of step. A second run waits for the first to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: The tag matches the version in pyproject.toml
        if: github.event_name == 'release'
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::the release tag is ${GITHUB_REF_NAME} but pyproject.toml says ${version}"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: uv build

      - name: The package is what a release should ship
        run: |
          uv run --no-project python scripts/check-package.py dist
          uvx twine check --strict dist/*

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/webvigil/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload credential
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/webvigil/
    permissions:
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags 1.0.0, 1.0, 1 and latest from the release tag v1.0.0. A manual run has no tag: it gets
      # the branch name, and is never pushed.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      # Built once for the host architecture and loaded, so the tests and the scan look at the
      # image that is about to be published and nothing is pushed until they pass.
      - name: Build the image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: webvigil:release
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: scripts/smoke-image.sh webvigil:release

      # Stricter than CI: HIGH as well as CRITICAL, with a fix available, stops the release.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: webvigil:release
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        if: github.event_name == 'release'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for amd64 and arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Sign the build provenance
        if: github.event_name == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
