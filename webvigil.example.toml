# WebVigil configuration example.
# Copy to `webvigil.toml` (or pass with `--config`) and adjust.
# CLI flags override values set here.

[scan]
mode = "passive"          # "passive" (default, safe for production) | "active"
scope = "host"            # "host" | "subdomains"
max_pages = 50            # crawler page-count limit
follow_robots = true      # respect robots.txt during crawling
submit_forms = true       # submit safe GET forms (search, filters) during the crawl to
                          # widen coverage; POST forms are never submitted by the crawler
# openapi = "openapi.json"  # spec 013: a local .json path or an in-scope URL returning JSON
                          # (an OpenAPI 3.x / Swagger 2.0 document). Its operations seed the
                          # crawl and the injection pass. CLI: --openapi <path|url>
# openapi_max_operations = 150  # cap on operations seeded from the import; excess is a warning

[http]
concurrency = 8           # max simultaneous requests
delay_ms = 0             # delay between requests to the same host
timeout_s = 15
user_agent = "WebVigil/0.1 (+https://github.com/ryanvmorais/webvigil)"
verify_tls = true         # set false only for testing against self-signed certs

[report]
format = "json"           # "json" | "sarif" | "html" | "md"
# output = "report.json"  # default: stdout
fail_on = "none"          # "none" | "info" | "low" | "medium" | "high" | "critical"

# Active Mode only — required when mode = "active".
# [active]
# authorized_by = "Jane Doe / Engagement #1234"

# Authenticated scan (spec 007, spec 013). Cookies are "name=value"; headers are
# "Name: Value" (a bearer token, an API key). Both are sent only on requests to the target
# host — never off-host, never written to a report or the scan metadata. Host and
# Content-Length are rejected. CLI: --cookie "name=value" / --header "Name: Value"
# (both repeatable), which replace the respective list.
[auth]
cookies = []
headers = []

# Suppress specific checks by id.
# [checks]
# disabled = ["http.headers.permissions-policy-missing"]

[disclosure]
probe = false            # opt-in: GET a curated list of well-known sensitive paths
                         # (.git, .env, backups, debug endpoints, exposed manifests).
                         # Safe (GET only, in scope, good-neighbor policy applies) but
                         # noisier than the default passive scan. Unrelated to Active Mode.

[injection]
# Active-injection tuning (spec 006). Only consulted on an Active scan
# (mode = "active"); ignored by a passive scan.
request_budget = 600      # max crafted requests per scan; hitting it is a warning
max_injection_points = 200  # max query params / form fields tested; excess is a warning
time_based_sqli = true    # send time-delay SQLi payloads (slower); --no-time-based-sqli overrides
time_based_cmdi = true    # spec 011: send time-delay OS-command-injection payloads (slower);
                          # --no-time-based-cmdi overrides. Shares the time budget with SQLi
time_based_delay_s = 5    # the D in SLEEP(D); keep it below [http] timeout_s
stored_xss = false        # spec 008: two-phase stored-XSS pass. Submits marker payloads the
                          # target stores and does NOT remove. --stored-xss overrides
xxe = false               # spec 012: re-send POST bodies as XML with an external-entity
                          # payload. Off by default (rewrites the body; most endpoints 400).
                          # --xxe overrides
envelope_url_sample = 15  # spec 012: pages the request-envelope pass re-requests with a
                          # poisoned Host / an OPTIONS probe
envelope_budget = 120     # spec 012: total requests the request-envelope pass may spend

[deps]
# Dependency-fingerprint tuning (spec 004, spec 010).
osv_online = false        # spec 010: look up detected libraries against OSV.dev. Sends the
                          # names + versions of the client-side libraries the scan detected
                          # to api.osv.dev (the only host the engine contacts besides the
                          # target). Augments the offline Retire.js match. --osv-online overrides
# osv_timeout_s = 10.0    # total timeout for the OSV.dev request; on timeout the scan
                          # proceeds with the offline results and a warning
# osv_base_url = "https://api.osv.dev"

# Web API only (extra `web`). Ignored by the CLI and the engine.
# Every key can also be set from the environment: WEBVIGIL_DATABASE_PATH,
# WEBVIGIL_WEB_HOST, WEBVIGIL_WEB_PORT, WEBVIGIL_SESSION_SECRET, WEBVIGIL_COOKIE_SECURE,
# WEBVIGIL_AUTO_MIGRATE, WEBVIGIL_CORS_ORIGINS.
# [web]
# database_path = "webvigil.db"     # SQLite file; created on first run
# host = "127.0.0.1"
# port = 8000
# session_secret = ""               # unset: generated once and stored in the database
# session_ttl_hours = 12
# cookie_secure = false             # set true when served over HTTPS
# auto_migrate = true               # run "alembic upgrade head" on startup
# cors_origins = []                 # browser origins allowed to call the API with credentials
