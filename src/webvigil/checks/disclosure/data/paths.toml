severity = "medium"
title = "ASP.NET trace viewer (trace.axd) exposed"
content = '(?i)Application Trace|Requests to this Application'

# --- Backups / archives / dumps ----------------------------------------------------
#
# The loader builds one entry per basename x suffix. The target's own host label is
# appended to `basenames` at scan time. A ".sql" / ".sql.gz" hit is HIGH; the rest MEDIUM.

[backups]
check = "disclosure.backup.file-exposed"
basenames = ["index", "db", "backup", "dump", "site", "www"]
suffixes = [".bak", ".old", "~", ".zip", ".tar.gz", ".sql"]
