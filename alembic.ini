# Alembic config for the `alembic` shell command during development.
# The Web API itself runs migrations via webvigil.api.db.run_alembic_upgrade, which sets
# script_location and the database URL programmatically.
[alembic]
script_location = src/webvigil/api/migrations
prepend_sys_path = .
# URL is resolved by env.py from WebConfig / WEBVIGIL_CONFIG when left as the placeholder.
sqlalchemy.url = driver://user:pass@localhost/dbname
