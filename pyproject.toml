# =============================================================================
# Project configuration (PEP 621) — built with Hatchling, managed with uv.
#
#   [project]                        metadata + engine/CLI runtime dependencies
#   [project.optional-dependencies]  web    the Web API extra (uv sync --extra web)
#   [dependency-groups] dev          lint / type / test tooling (installed by default)
#   [tool.*]                         config for ruff, black, mypy, import-linter, pytest
#
# Exact versions of the whole graph (direct + transitive) are pinned in uv.lock
# (`uv lock`); the lines below are lower-bound floors only.
# =============================================================================

[project]
name = "webvigil"
version = "0.0.0"
description = "A web application vulnerability scanner for developers — safe by default, CI-friendly."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Morais" }]
keywords = ["security", "scanner", "web", "vulnerability", "dast", "appsec", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "httpx[http2]>=0.28.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "jinja2>=3.1.6",
    "cryptography>=50.0.2",
    "selectolax>=0.4.13",
    # Version-range evaluation for the dependency-fingerprint advisory match (spec 004, ADR-7).
    "packaging>=26.3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.52.4",
    "sqlmodel>=0.0.47",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
]

[project.scripts]
webvigil = "webvigil.cli.app:main"
webvigil-web = "webvigil.api.cli:main"

[project.urls]
Homepage = "https://github.com/ryanvmorais/webvigil"
Repository = "https://github.com/ryanvmorais/webvigil"
Issues = "https://github.com/ryanvmorais/webvigil/issues"

[dependency-groups]
dev = [
    # Lint / format / types (see the `webvigil` command list in CLAUDE.md).
    "ruff>=0.16.10",
    "black>=26.5.1",
    "mypy>=2.4.0",
    # Architecture contract: `lint-imports` enforces engine purity (RNF-01 / ADR-1).
    "import-linter>=2.15",
    # Test runner and helpers.
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    # Coverage: the guard of the test-suite audit (issue #101) — a refactor of the tests must not
    # lower the per-file line and branch coverage of `src/webvigil`.
    "pytest-cov>=7.1.0",
    # Starlette: the insecure/hardened fixture app for the integration test (RF-27).
    "starlette>=1.7.0",
    # jsonschema: validates the SARIF reporter output against the bundled 2.1.0 schema (ADR-7).
    "jsonschema>=4.26.0",
    # trustme: mints throwaway TLS certificates for the TLS-check tests (RF-19).
    "trustme>=1.2.1",
]

# --- Packaging (Hatchling) ---------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webvigil"]
artifacts = [
    "src/webvigil/reporting/templates/*",
    "src/webvigil/api/migrations/**/*.py",
    "src/webvigil/api/migrations/script.py.mako",
    "src/webvigil/checks/deps/data/*.json",
    "src/webvigil/checks/disclosure/data/*.toml",
]

# --- Lint (ruff: replaces flake8 + isort, reads pyproject natively) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Auto-generated Alembic revisions keep Alembic's own style.
extend-exclude = ["src/webvigil/api/migrations/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, flake8-simplify,
# flake8-comprehensions, ruff-native.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["webvigil"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

# --- Format (black) ---------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Types (mypy, strict) --------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Type-checking covers the shipped package only; `tests/` is exercised by pytest.
files = ["src"]
# Auto-generated Alembic revisions use dynamic sqlmodel attributes mypy can't see.
exclude = ["^src/webvigil/api/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

# --- Coverage (pytest-cov) -------------------------------------------------
# Not part of the default `pytest` run: `uv run pytest --cov` measures it (issue #101 uses the
# per-file numbers as the guard when tests are merged or removed).
[tool.coverage.run]
source = ["src/webvigil"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# --- Tests (pytest) --------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# --- Architecture contract (import-linter — RNF-01 / ADR-1) ---------------
[tool.importlinter]
root_package = "webvigil"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine stays independent of UI and persistence"
type = "forbidden"
source_modules = [
    "webvigil.core",
    "webvigil.http",
    "webvigil.crawler",
    "webvigil.checks",
    "webvigil.reporting",
]
forbidden_modules = [
    "typer",
    "rich",
    "fastapi",
    "sqlmodel",
    "alembic",
    "pyjwt",
    "jwt",
    "argon2",
    "uvicorn",
    "webvigil.cli",
    "webvigil.api",
]

[[tool.importlinter.contracts]]
name = "CLI and Web API do not import each other"
type = "independence"
modules = [
    "webvigil.cli",
    "webvigil.api",
]
